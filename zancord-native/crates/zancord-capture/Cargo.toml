[package]
name = "zancord-capture"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
zancord-protocol = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Webcam capture (Phase 5.2): nokhwa drives the device on its own thread;
# `input-native` selects AVFoundation/V4L2/MediaFoundation per platform and
# `decoding` enables RGB24 conversion of the captured frames.
nokhwa = { version = "0.10", features = ["input-native", "decoding", "output-threaded"] }

# Platform-specific backends (added in Phase 3):
# macOS:  screencapturekit, core-foundation, core-video, objc2
# Linux:  ashpd, pipewire, spa
[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "8", features = ["macos_13_0"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.10", features = ["tokio"] }
enumflags2 = "0.7"
pipewire = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
# Desktop Duplication API (display capture). Feature set matches the API
# surface used in `src/windows.rs`.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Com",
] }
