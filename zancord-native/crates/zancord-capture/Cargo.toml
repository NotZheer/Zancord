[package]
name = "zancord-capture"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
zancord-protocol = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Platform-specific backends (added in Phase 3):
# macOS:  screencapturekit, core-foundation, core-video, objc2
# Linux:  ashpd, pipewire, spa
[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "8", features = ["macos_13_0"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.10", features = ["tokio"] }
enumflags2 = "0.7"
pipewire = "0.10"
