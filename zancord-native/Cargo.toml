[workspace]
resolver = "2"
members = [
    "crates/zancord-protocol",
    "crates/zancord-signaling-server",
    "crates/zancord-signaling-client",
    "crates/zancord-audio",
    "crates/zancord-capture",
    "crates/zancord-video",
    "crates/zancord-transport",
    "crates/zancord-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
bytes = "1"
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
slint = { version = "1.17", features = ["backend-winit", "backend-winit-x11", "backend-winit-wayland", "image-default-formats"] }
slint-build = "1.17"
zancord-protocol = { path = "crates/zancord-protocol" }

[profile.release]
lto = "thin"
opt-level = 3
